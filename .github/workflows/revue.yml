name: Revue de presse quotidienne

on:
  schedule:
    # 05:30 UTC = 07:30 heure de Paris en été, 06:30 en hiver
    - cron: "42 3 * * *"
  workflow_dispatch:        # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer la revue de presse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAIL_EXPEDITEUR: ${{ secrets.MAIL_EXPEDITEUR }}
          MAIL_MOT_DE_PASSE: ${{ secrets.MAIL_MOT_DE_PASSE }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE }}
        run: python main.py

      - name: Publier le fichier
        run: |
          git config user.name "revue-presse-bot"
          git config user.email "actions@github.com"
          git add briefs/ dernier.md
          git diff --staged --quiet || git commit -m "Revue de presse du $(date +%d/%m/%Y)"
          git push

